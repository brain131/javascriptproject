<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form validation</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="text"></p>
    <p id="message"></p>
 <form action=""class="form-wrapper">
    
    <div class="form-card">
        <div>
        <p id="greeting"></p>

    </div>
  <div class="input-container">
        <input type="text"placeholder="username"id="name"required>
    </div>
     <div class="input-container">
        <input type="text"placeholder="age"id="age"required>
    </div>
     <div class="input-container">
        <input type="date"placeholder="Date of birth"id="date"required>
    </div>
     <div class="input-container">
        <input type="number"placeholder="contact"id="contact"required>
    </div>
    <div class="input-container">
        <button type="button"onclick="display()">Submit</button>

    </div>
   
    </div>
 </form>   
<section id="search">
   <input type="text" id=inputData placeholder="Enter Post Id (1-100)"> 
   <button onclick="search()">Search</button>
    <div>
        <h2 id="title"></h2>
        <p3 id="body"></p3>
    </div>
</section>



</body>
</html>
